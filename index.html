tive z-10">
                                <button type="button" onclick="addTabungan()" class="flex-1 bg-cyan-500/20 hover:bg-cyan-500/40 text-cyan-300 py-3 rounded-xl font-bold border border-cyan-500/50 transition-all text-sm flex items-center justify-center gap-2">
                                    <i class="fas fa-plus"></i> Nabung
                                </button>
                                <button type="button" onclick="tarikTabungan()" class="flex-1 bg-slate-800/80 hover:bg-slate-700 text-slate-300 py-3 rounded-xl font-bold border border-slate-600/50 transition-all text-sm flex items-center justify-center gap-2">
                                    <i class="fas fa-minus"></i> Tarik
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ================= RIGHT COLUMN (Analytics & History) ================= -->
                <div class="xl:col-span-8 space-y-8 lg:space-y-10">
                    
                    <!-- Analytics Section -->
                    <div id="section-analytics" class="glass-panel p-6 lg:p-10 rounded-[2.5rem] shadow-2xl scroll-mt-10">
                        <h2 class="text-xl font-extrabold text-white mb-6 flex items-center gap-3">
                            <div class="p-3 rounded-xl bg-blue-500/20 text-blue-400"><i class="fas fa-chart-pie"></i></div>
                            Analisis Pengeluaran
                        </h2>
                        <div class="relative h-[300px] lg:h-[400px] w-full bg-slate-900/50 rounded-2xl p-4 border border-white/5">
                            <canvas id="expenseChart"></canvas>
                        </div>
                    </div>

                    <!-- History Section -->
                    <div id="section-history" class="glass-panel p-6 lg:p-10 rounded-[2.5rem] shadow-2xl scroll-mt-10">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-extrabold text-white flex items-center gap-3">
                                <div class="p-3 rounded-xl bg-emerald-500/20 text-emerald-400"><i class="fas fa-clock-rotate-left"></i></div>
                                Riwayat Terakhir
                            </h2>
                            <span class="text-xs font-bold text-slate-500 bg-slate-900 px-3 py-1.5 rounded-lg border border-white/10">Bulan Ini</span>
                        </div>
                        
                        <div class="overflow-x-auto custom-scrollbar pb-2">
                            <table class="w-full text-left border-collapse min-w-[500px]">
                                <thead>
                                    <tr class="border-b border-white/10 text-xs uppercase tracking-widest text-slate-500">
                                        <th class="pb-4 font-bold pl-2">Keterangan</th>
                                        <th class="pb-4 font-bold">Kategori</th>
                                        <th class="pb-4 font-bold text-right">Nominal</th>
                                        <th class="pb-4 font-bold text-center pr-2">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="history-body" class="text-sm">
                                    <!-- Data History akan di-render di sini oleh JavaScript -->
                                </tbody>
                            </table>
                        </div>
                        
                        <!-- Empty State -->
                        <div id="empty-state" class="hidden flex-col items-center justify-center py-12 text-center">
                            <div class="w-20 h-20 bg-slate-800/50 rounded-full flex items-center justify-center mb-4 border border-slate-700">
                                <i class="fas fa-ghost text-3xl text-slate-500 animate-float"></i>
                            </div>
                            <p class="text-slate-400 font-bold text-sm">Belum ada transaksi.</p>
                            <p class="text-slate-500 text-xs mt-1">Ayo mulai catat keuanganmu hari ini!</p>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
    </main>

    <!-- ================= MOBILE BOTTOM NAVIGATION ================= -->
    <nav class="lg:hidden fixed bottom-0 w-full glass-panel border-t border-white/10 pb-safe z-50 rounded-t-[2rem] shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
        <div class="flex justify-around items-center p-3 relative">
            <a href="#top-dashboard" class="flex flex-col items-center gap-1.5 text-purple-400 p-2 group">
                <i class="fas fa-home text-xl group-active:scale-90 transition-transform"></i>
                <span class="text-[9px] font-bold uppercase tracking-wider">Home</span>
            </a>
            <a href="#section-form" class="flex flex-col items-center gap-1.5 text-slate-500 hover:text-pink-400 transition-colors p-2 group">
                <i class="fas fa-pen-to-square text-xl group-active:scale-90 transition-transform"></i>
                <span class="text-[9px] font-bold uppercase tracking-wider">Catat</span>
            </a>
            <a href="#section-analytics" class="flex flex-col items-center gap-1.5 text-slate-500 hover:text-cyan-400 transition-colors p-2 group">
                <i class="fas fa-chart-pie text-xl group-active:scale-90 transition-transform"></i>
                <span class="text-[9px] font-bold uppercase tracking-wider">Analisis</span>
            </a>
            <a href="#section-history" class="flex flex-col items-center gap-1.5 text-slate-500 hover:text-emerald-400 transition-colors p-2 group">
                <i class="fas fa-list-ul text-xl group-active:scale-90 transition-transform"></i>
                <span class="text-[9px] font-bold uppercase tracking-wider">History</span>
            </a>
        </div>
    </nav>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        // Data Setup & LocalStorage
        let transactions = JSON.parse(localStorage.getItem('uangku_transactions')) || [];
        let targetTabungan = JSON.parse(localStorage.getItem('uangku_target')) || {
            name: "Beli Gadget Impian 📱",
            total: 1000000,
            saved: 0
        };

        let expenseChartInstance = null;

        const kategoriOptions = {
            expense: ['Makan & Minum', 'Transportasi', 'Nongkrong/Hiburan', 'Belanja', 'Tagihan', 'Lainnya'],
            income: ['Gaji', 'Uang Saku', 'Bonus/Hadiah', 'Investasi', 'Lainnya']
        };

        // Format Currency
        const formatRupiah = (angka) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(angka);
        };

        // Initialize App
        function initApp() {
            updateKategoriForm();
            updateDashboard();
            updateTargetUI();
        }

        // Kategori Form Logic
        function updateKategoriForm() {
            const tipe = document.querySelector('input[name="tipe"]:checked').value;
            const select = document.getElementById('input-kategori');
            select.innerHTML = '';
            
            kategoriOptions[tipe].forEach(kat => {
                const option = document.createElement('option');
                option.value = kat;
                option.textContent = kat;
                select.appendChild(option);
            });
        }

        // Handle Form Submit
        function handleFormSubmit(e) {
            e.preventDefault();
            
            const tipe = document.querySelector('input[name="tipe"]:checked').value;
            const nominal = parseInt(document.getElementById('input-nominal').value);
            const kategori = document.getElementById('input-kategori').value;
            const keterangan = document.getElementById('input-keterangan').value;
            const date = new Date().toISOString();

            if(!nominal || !keterangan) return showToast("Data tidak lengkap!", "error");

            const newTransaction = { id: Date.now(), tipe, nominal, kategori, keterangan, date };
            
            transactions.unshift(newTransaction); // Add to beginning
            saveData();
            
            document.getElementById('input-nominal').value = '';
            document.getElementById('input-keterangan').value = '';
            
            updateDashboard();
            showToast("Transaksi berhasil dicatat!", "success");
        }

        // Quick Add Shortcut
        function quickAddExpense(keterangan, kategori, nominal) {
            const newTransaction = {
                id: Date.now(),
                tipe: 'expense',
                nominal: nominal,
                kategori: kategori,
                keterangan: keterangan,
                date: new Date().toISOString()
            };
            transactions.unshift(newTransaction);
            saveData();
            updateDashboard();
            showToast(`${keterangan} berhasil dicatat!`, "success");
        }

        // Update Dashboard Data
        function updateDashboard() {
            let totalMasuk = 0;
            let totalKeluar = 0;

            transactions.forEach(t => {
                if(t.tipe === 'income') totalMasuk += t.nominal;
                if(t.tipe === 'expense') totalKeluar += t.nominal;
            });

            const saldo = totalMasuk - totalKeluar;

            document.getElementById('total-masuk').innerText = formatRupiah(totalMasuk);
            document.getElementById('total-keluar').innerText = formatRupiah(totalKeluar);
            document.getElementById('saldo-utama').innerText = formatRupiah(saldo);
            
            // Warn if saldo is low/negative
            const saldoEl = document.getElementById('saldo-utama');
            if (saldo < 0) {
                saldoEl.classList.replace('text-white', 'text-rose-500');
            } else {
                saldoEl.classList.replace('text-rose-500', 'text-white');
            }

            renderHistory();
            updateChart();
        }

        // Render History Table
        function renderHistory() {
            const tbody = document.getElementById('history-body');
            const emptyState = document.getElementById('empty-state');
            tbody.innerHTML = '';

            if(transactions.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                // Tampilkan maksimal 10 transaksi terakhir
                transactions.slice(0, 10).forEach(t => {
                    const tr = document.createElement('tr');
                    tr.className = "border-b border-white/5 hover:bg-white/5 transition-colors";
                    
                    const isIncome = t.tipe === 'income';
                    const colorClass = isIncome ? 'text-emerald-400' : 'text-rose-400';
                    const iconClass = isIncome ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down';

                    tr.innerHTML = `
                        <td class="py-4 pl-2">
                            <div class="font-bold text-white flex items-center gap-2">
                                <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center ${colorClass} bg-opacity-30">
                                    <i class="fas ${iconClass} text-xs"></i>
                                </div>
                                ${t.keterangan}
                            </div>
                            <div class="text-[10px] text-slate-500 mt-1 ml-10">${new Date(t.date).toLocaleDateString('id-ID', {day:'numeric', month:'short'})}</div>
                        </td>
                        <td class="py-4 text-slate-400 text-xs font-semibold">${t.kategori}</td>
                        <td class="py-4 text-right font-extrabold ${colorClass}">${isIncome ? '+' : '-'}${formatRupiah(t.nominal)}</td>
                        <td class="py-4 text-center pr-2">
                            <button onclick="deleteTransaction(${t.id})" class="w-8 h-8 rounded-lg bg-rose-500/10 hover:bg-rose-500/30 text-rose-400 transition-colors">
                                <i class="fas fa-trash-alt text-xs"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        function deleteTransaction(id) {
            if(confirm("Hapus transaksi ini?")) {
                transactions = transactions.filter(t => t.id !== id);
                saveData();
                updateDashboard();
                showToast("Transaksi dihapus", "success");
            }
        }

        // Save to LocalStorage
        function saveData() {
            localStorage.setItem('uangku_transactions', JSON.stringify(transactions));
            localStorage.setItem('uangku_target', JSON.stringify(targetTabungan));
        }

        function clearAllData() {
            if(confirm("PERINGATAN: Semua data transaksi akan dihapus permanen. Lanjutkan?")) {
                transactions = [];
                saveData();
                updateDashboard();
                showToast("Semua data berhasil di-reset", "success");
            }
        }

        // Export Data
        function exportToCSV() {
            if(transactions.length === 0) return showToast("Tidak ada data untuk diexport", "error");
            
            let csvContent = "data:text/csv;charset=utf-8,Tanggal,Tipe,Kategori,Keterangan,Nominal\n";
            
            transactions.forEach(t => {
                let row = `${new Date(t.date).toLocaleDateString('id-ID')},${t.tipe},${t.kategori},"${t.keterangan}",${t.nominal}`;
                csvContent += row + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Uangku_Data.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("Data berhasil diexport!", "success");
        }

        // Target Tabungan Logic
        function updateTargetUI() {
            document.getElementById('target-name').innerText = targetTabungan.name;
            document.getElementById('target-total').innerText = formatRupiah(targetTabungan.total);
            document.getElementById('target-saved').innerText = formatRupiah(targetTabungan.saved);
            
            let percent = (targetTabungan.saved / targetTabungan.total) * 100;
            if(percent > 100) percent = 100;
            
            document.getElementById('target-percent').innerText = `${Math.round(percent)}%`;
            document.getElementById('target-bar').style.width = `${percent}%`;
        }

        function editTarget() {
            const newName = prompt("Nama Target Baru (Misal: Sepatu):", targetTabungan.name);
            if(newName === null) return;
            const newTotalStr = prompt("Nominal Target (Misal: 500000):", targetTabungan.total);
            if(newTotalStr === null) return;
            
            const newTotal = parseInt(newTotalStr.replace(/\D/g,''));
            
            if(newName && newTotal > 0) {
                targetTabungan.name = newName;
                targetTabungan.total = newTotal;
                saveData();
                updateTargetUI();
                showToast("Target diperbarui!", "success");
            }
        }

        function addTabungan() {
            const amountStr = prompt("Nominal yang ingin ditabung (Misal: 50000):");
            if(!amountStr) return;
            const amount = parseInt(amountStr.replace(/\D/g,''));
            if(amount > 0) {
                targetTabungan.saved += amount;
                saveData();
                updateTargetUI();
                showToast("Semangat nabungnya!", "success");
            }
        }

        function tarikTabungan() {
            const amountStr = prompt("Nominal yang ingin ditarik:");
            if(!amountStr) return;
            const amount = parseInt(amountStr.replace(/\D/g,''));
            if(amount > 0 && amount <= targetTabungan.saved) {
                targetTabungan.saved -= amount;
                saveData();
                updateTargetUI();
                showToast("Tabungan ditarik.", "success");
            } else if (amount > targetTabungan.saved) {
                showToast("Saldo tabungan tidak cukup!", "error");
            }
        }

        // Chart.js Setup
        function updateChart() {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            
            const expenses = transactions.filter(t => t.tipe === 'expense');
            const dataMap = {};
            
            expenses.forEach(t => {
                dataMap[t.kategori] = (dataMap[t.kategori] || 0) + t.nominal;
            });

            const labels = Object.keys(dataMap);
            const data = Object.values(dataMap);

            if(expenseChartInstance) {
                expenseChartInstance.destroy();
            }

            if(labels.length === 0) {
                // Tampilkan chart kosong jika tidak ada data
                expenseChartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Belum ada pengeluaran'],
                        datasets: [{ data: [1], backgroundColor: ['#1e293b'], borderWidth: 0 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '75%' }
                });
                return;
            }

            expenseChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: [
                            '#ec4899', // Pink
                            '#a855f7', // Purple
                            '#3b82f6', // Blue
                            '#10b981', // Emerald
                            '#f59e0b', // Amber
                            '#64748b'  // Slate
                        ],
                        borderWidth: 2,
                        borderColor: '#0f172a',
                        hoverOffset: 10
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: { color: '#cbd5e1', font: { family: "'Plus Jakarta Sans', sans-serif", size: 12, weight: 'bold' }, padding: 20 }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#fff',
                            bodyColor: '#fff',
                            borderColor: 'rgba(168, 85, 247, 0.3)',
                            borderWidth: 1,
                            padding: 12,
                            callbacks: {
                                label: function(context) {
                                    let value = context.raw;
                                    return ' ' + formatRupiah(value);
                                }
                            }
                        }
                    }
                }
            });
        }

        // Toast Notification System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgColor = type === 'success' ? 'bg-emerald-500/20' : 'bg-rose-500/20';
            const borderColor = type === 'success' ? 'border-emerald-500/50' : 'border-rose-500/50';
            const iconColor = type === 'success' ? 'text-emerald-400' : 'text-rose-400';
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-circle-exclamation';

            toast.className = `glass-panel ${bgColor} border ${borderColor} text-white px-5 py-4 rounded-2xl shadow-xl flex items-center gap-3 toast-enter backdrop-blur-xl`;
            toast.innerHTML = `
                <i class="fas ${icon} ${iconColor} text-xl"></i>
                <p class="font-bold text-sm tracking-wide">${message}</p>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Run On Load
        window.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
